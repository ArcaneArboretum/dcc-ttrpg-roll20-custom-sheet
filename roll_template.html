<!-- ROLL TEMPLATE DEFAULT -->
<rolltemplate class="sheet-rolltemplate-default">
  <div class="sheet-rt">
    <div class="sheet-rt-head">
      {{name}}
      {{#character}}<div class="sheet-rt-char">{{character}}</div>{{/character}}
    </div>
    <div class="sheet-rt-body">
      <span class="sheet-rt-roll">{{roll}}</span>
    </div>
  </div>
</rolltemplate>

<!-- One-Time Bonus Template (Called Play, Intervene, etc.)-->
<rolltemplate class="sheet-rolltemplate-otb">
  <div class="sheet-rt">
    <div class="sheet-rt-head">
      {{name}}
      {{#character}}<div class="sheet-rt-char">{{character}}</div>{{/character}}
    </div>
    <div class="sheet-rt-body">
      <span class="sheet-rt-roll">{{roll}}</span>
    </div>
  </div>
</rolltemplate>
